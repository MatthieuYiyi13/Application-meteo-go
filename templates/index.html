<!DOCTYPE html>
<html lang="fr">
{{template "head" "Accueil"}}
<body>
    <main class="container page">
        <section class="hero">
            <h1>La météo de ta commune</h1>
            {{template "recherche" .Recherche}}
            {{if .Communes}}
            <form class="search-form choix-commune" action="/previsions" method="get">
                <input type="hidden" name="q" value="{{.Recherche}}">
                <label for="commune">Choisir une commune parmi les résultats</label>
                <select id="commune" name="commune" required>
                    <option value="">Sélectionner une commune</option>
                    {{range .Communes}}
                    <option value="{{.Code}}">{{.Nom}}{{if .Departement}} ({{.Departement}}){{end}}</option>
                    {{end}}
                </select>
                <button type="submit">Voir la météo</button>
            </form>
            {{end}}
        </section>
    </main>
</body>
</html>
