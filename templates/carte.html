<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Carte de la commune</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="anonymous">
    <style>
        html, body, #map { height: 100%; margin: 0; }
        #map { background: #eef6ff; }
    </style>
</head>
<body>
    <div id="map" aria-label="Carte de la commune"></div>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
            integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin="anonymous"></script>
    <script>
        const params = new URLSearchParams(window.location.search);
        const latitude = Number.parseFloat(params.get("lat"));
        const longitude = Number.parseFloat(params.get("lon"));

        if (window.L && Math.abs(latitude) <= 90 && Math.abs(longitude) <= 180) {
            const centre = [latitude, longitude];
            const map = L.map("map", { scrollWheelZoom: false }).setView(centre, 13);
            map.attributionControl.setPrefix(false);
            L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
                maxZoom: 19,
                attribution: '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">Contributeurs OpenStreetMap</a>'
            }).addTo(map);
            L.marker(centre, { alt: "Centre de la commune" }).addTo(map);
        } else {
            document.getElementById("map").textContent = "La carte est indisponible.";
        }
    </script>
</body>
</html>
